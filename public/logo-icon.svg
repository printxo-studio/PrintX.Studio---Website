<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="iconRedGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E43" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="iconSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="iconDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272A" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
  </defs>

  <!-- Top Face -->
  <polygon points="32,4 60,20 32,36 4,20" fill="url(#iconSilver)" />
  <!-- Left Face -->
  <polygon points="4,20 32,36 32,60 4,44" fill="url(#iconDark)" stroke="#3F3F46" stroke-width="1" />
  <!-- Right Face -->
  <polygon points="60,20 32,36 32,60 60,44" fill="url(#iconRedGlow)" />
  <!-- 3D Print Nozzle Beam -->
  <line x1="32" y1="22" x2="32" y2="48" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <circle cx="32" cy="52" r="3.5" fill="#FF2E43" />
</svg>
