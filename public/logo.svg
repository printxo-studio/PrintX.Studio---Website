<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" fill="none">
  <defs>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E43" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="silverShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="darkFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272A" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 3D Isometric Maker Cube Icon -->
  <g transform="translate(10, 10)">
    <!-- Top Face -->
    <polygon points="30,0 60,17 30,34 0,17" fill="url(#silverShine)" opacity="0.95" />
    <!-- Left Face -->
    <polygon points="0,17 30,34 30,60 0,43" fill="url(#darkFacet)" stroke="#3F3F46" stroke-width="1" />
    <!-- Right Face (Vivid Crimson) -->
    <polygon points="60,17 30,34 30,60 60,43" fill="url(#redGlow)" />
    
    <!-- 3D Print Layer Lines (Futuristic Nozzle effect) -->
    <line x1="30" y1="20" x2="30" y2="48" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)" />
    <path d="M15 25 L30 34 L45 25" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />
    <circle cx="30" cy="52" r="3" fill="#FF2E43" filter="url(#glow)" />
  </g>

  <!-- Typography: PRINTXO STUDIO -->
  <g transform="translate(85, 52)">
    <text font-family="system-ui, -apple-system, 'Inter', sans-serif" font-weight="900" font-size="36" letter-spacing="1.5">
      <tspan fill="#FFFFFF">PRINT</tspan>
      <tspan fill="url(#redGlow)">XO</tspan>
    </text>
    <text x="180" y="-3" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-weight="600" font-size="14" fill="#94A3B8" letter-spacing="6">
      STUDIO
    </text>
    <!-- Accent Line -->
    <rect x="180" y="5" width="46" height="2.5" rx="1.25" fill="url(#redGlow)" />
  </g>
</svg>
